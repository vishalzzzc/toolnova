<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ToolNova — Free Online Tools</title>

<meta name="description"
      content="ToolNova — free online calculators, converters, image tools, text tools, QR tools and everyday utilities.">

<meta name="robots"
      content="index, follow">

<link rel="canonical"
      href="https://vishalzzzc.github.io/toolnova/">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Arial,
    sans-serif;

    color:#fff;

    background:
    radial-gradient(
        circle at 10% 5%,
        rgba(65,105,255,.22),
        transparent 30%
    ),
    radial-gradient(
        circle at 90% 20%,
        rgba(155,75,255,.16),
        transparent 30%
    ),
    radial-gradient(
        circle at 50% 100%,
        rgba(20,140,255,.12),
        transparent 30%
    ),
    #05070d;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-10;
}

.glow{
    position:absolute;

    border-radius:50%;

    filter:blur(70px);

    opacity:.32;

    will-change:transform;
}

.glow.one{
    width:340px;
    height:340px;

    left:-110px;
    top:-110px;

    background:#3568ff;

    animation:
    glowOne 18s ease-in-out infinite alternate;
}

.glow.two{
    width:300px;
    height:300px;

    right:-100px;
    top:28%;

    background:#913fff;

    animation:
    glowTwo 21s ease-in-out infinite alternate;
}

.glow.three{
    width:270px;
    height:270px;

    left:35%;
    bottom:-130px;

    background:#008cff;

    animation:
    glowThree 20s ease-in-out infinite alternate;
}

@keyframes glowOne{

    from{
        transform:translate3d(0,0,0);
    }

    to{
        transform:translate3d(55px,35px,0);
    }

}

@keyframes glowTwo{

    from{
        transform:translate3d(0,0,0);
    }

    to{
        transform:translate3d(-50px,-40px,0);
    }

}

@keyframes glowThree{

    from{
        transform:translate3d(0,0,0);
    }

    to{
        transform:translate3d(45px,-35px,0);
    }

}


/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;

    top:10px;

    z-index:1000;

    width:
    min(1120px,calc(100% - 24px));

    margin:
    12px auto 0;
}

.nav{
    min-height:68px;

    padding:
    10px 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-radius:23px;

    background:
    rgba(18,23,35,.68);

    border:
    1px solid
    rgba(255,255,255,.14);

    box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.12),

    0 18px 55px
    rgba(0,0,0,.24);

    backdrop-filter:
    blur(20px)
    saturate(150%);

    -webkit-backdrop-filter:
    blur(20px)
    saturate(150%);
}

.logo{
    display:flex;

    align-items:center;

    gap:10px;

    color:#fff;

    text-decoration:none;

    font-size:24px;

    font-weight:900;

    letter-spacing:-1px;
}

.logo-icon{
    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:
    linear-gradient(
        135deg,
        #6688ff,
        #9b65ff
    );

    box-shadow:
    0 8px 25px
    rgba(90,115,255,.32);
}

.logo-blue{
    color:#8da6ff;
}

.nav-links{
    display:flex;

    align-items:center;

    gap:4px;
}

.nav-links a{
    color:#aeb8ca;

    text-decoration:none;

    font-size:14px;

    padding:
    10px 13px;

    border-radius:12px;

    transition:.25s;
}

.nav-links a:hover{
    color:#fff;

    background:
    rgba(255,255,255,.08);
}


/* =========================================================
   HERO
========================================================= */

.hero{
    width:
    min(1000px,calc(100% - 24px));

    margin:auto;

    padding:
    105px 10px 70px;

    text-align:center;
}

.hero-badge{
    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:
    9px 15px;

    border-radius:999px;

    color:#b9c7ff;

    background:
    rgba(105,135,255,.10);

    border:
    1px solid
    rgba(135,160,255,.24);
}

.live-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#79a1ff;

    box-shadow:
    0 0 14px
    #79a1ff;
}

.hero h1{
    margin-top:25px;

    font-size:
    clamp(44px,8vw,82px);

    line-height:.99;

    letter-spacing:-5px;

    font-weight:900;
}

.hero-title{
    display:block;
}

.hero-gradient{
    display:block;

    margin-top:8px;

    background:
    linear-gradient(
        90deg,
        #7192ff,
        #a46cff,
        #65d5ff,
        #7192ff
    );

    background-size:
    300% auto;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:
    gradientFlow 8s linear infinite;
}

@keyframes gradientFlow{

    to{
        background-position:
        300% center;
    }

}

.hero-description{
    max-width:720px;

    margin:
    28px auto 0;

    color:#929daf;

    font-size:17px;

    line-height:1.8;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
    max-width:680px;

    margin:
    35px auto 0;

    position:relative;
}

.search-box input{
    width:100%;

    height:62px;

    padding:
    0 24px 0 58px;

    outline:none;

    border:
    1px solid
    rgba(255,255,255,.15);

    border-radius:21px;

    color:#fff;

    background:
    rgba(255,255,255,.075);

    font-size:16px;

    box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.10),

    0 15px 45px
    rgba(0,0,0,.18);

    backdrop-filter:
    blur(18px);

    -webkit-backdrop-filter:
    blur(18px);

    transition:.25s;
}

.search-box input::placeholder{
    color:#69768a;
}

.search-box input:focus{
    border-color:
    rgba(125,155,255,.65);

    box-shadow:
    0 0 0 4px
    rgba(110,140,255,.08),

    0 20px 55px
    rgba(0,0,0,.24);
}

.search-icon{
    position:absolute;

    left:20px;
    top:17px;

    color:#94aaff;

    font-size:24px;

    pointer-events:none;
}


/* =========================================================
   TOOLS SECTION
========================================================= */

.tools-section{
    width:
    min(1120px,calc(100% - 24px));

    margin:auto;

    padding:
    10px 0 80px;
}

.section-top{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:24px;
}

.section-title{
    display:flex;

    align-items:center;

    gap:12px;
}

.section-icon{
    width:46px;
    height:46px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
    rgba(110,140,255,.12);

    border:
    1px solid
    rgba(140,165,255,.18);

    font-size:22px;
}

.section-title h2{
    font-size:28px;

    letter-spacing:-1px;
}

.section-title p{
    margin-top:4px;

    color:#6d788b;

    font-size:13px;
}

.tool-count{
    color:#8d99ad;

    font-size:12px;

    padding:
    8px 13px;

    border-radius:999px;

    background:
    rgba(255,255,255,.05);

    border:
    1px solid
    rgba(255,255,255,.08);
}


/* =========================================================
   TOOL GRID
========================================================= */

.tools-grid{
    display:grid;

    grid-template-columns:
    repeat(3,minmax(0,1fr));

    gap:17px;

    width:100%;

    height:auto;

    max-height:none;

    overflow:visible;
}


/* =========================================================
   TOOL CARD
========================================================= */

.tool{
    position:relative;

    display:block;

    width:100%;

    min-width:0;

    min-height:205px;

    padding:24px;

    overflow:hidden;

    color:#fff;

    text-decoration:none;

    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.105),
        rgba(255,255,255,.035)
    );

    border:
    1px solid
    rgba(255,255,255,.12);

    box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.11),

    0 18px 50px
    rgba(0,0,0,.18);

    backdrop-filter:
    blur(18px)
    saturate(140%);

    -webkit-backdrop-filter:
    blur(18px)
    saturate(140%);

    transition:
    transform .28s ease,
    border-color .28s ease,
    box-shadow .28s ease;
}

.tool::before{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    right:-90px;
    top:-90px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(120,150,255,.28),
        transparent 70%
    );

    transition:.35s;

    pointer-events:none;
}

.tool:hover{
    transform:
    translateY(-7px);

    border-color:
    rgba(145,170,255,.40);

    box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.15),

    0 28px 65px
    rgba(0,0,0,.28);
}

.tool:hover::before{
    transform:scale(1.45);
}


/* =========================================================
   TOOL ICON
========================================================= */

.tool-icon{
    position:relative;

    width:56px;
    height:56px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:
    rgba(110,140,255,.12);

    border:
    1px solid
    rgba(145,170,255,.18);

    font-size:27px;

    transition:.25s;
}

.tool:hover .tool-icon{
    transform:
    scale(1.06)
    rotate(-3deg);
}

.tool h3{
    position:relative;

    margin-top:18px;

    font-size:18px;

    letter-spacing:-.2px;
}

.tool p{
    position:relative;

    max-width:300px;

    margin-top:8px;

    color:#7e8a9f;

    font-size:13px;

    line-height:1.6;
}

.tool-arrow{
    position:absolute;

    right:19px;
    bottom:19px;

    width:35px;
    height:35px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#9db1ff;

    background:
    rgba(255,255,255,.055);

    border:
    1px solid
    rgba(255,255,255,.08);

    transition:.25s;
}

.tool:hover .tool-arrow{
    transform:
    translateX(5px);

    background:
    rgba(110,140,255,.14);
}


/* =========================================================
   NO RESULTS
========================================================= */

.no-results{
    display:none;

    padding:
    40px 20px;

    text-align:center;

    color:#7e8a9f;

    border-radius:22px;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid
    rgba(255,255,255,.08);
}


/* =========================================================
   WHY TOOLNOVA
========================================================= */

.why{
    width:
    min(1120px,calc(100% - 24px));

    margin:
    20px auto 80px;
}

.why-card{
    padding:42px;

    border-radius:29px;

    background:
    rgba(255,255,255,.055);

    border:
    1px solid
    rgba(255,255,255,.10);

    box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.09),

    0 25px 70px
    rgba(0,0,0,.20);

    backdrop-filter:
    blur(18px);

    -webkit-backdrop-filter:
    blur(18px);
}

.why-card h2{
    font-size:32px;

    letter-spacing:-1px;
}

.why-card>p{
    max-width:730px;

    margin-top:12px;

    color:#8490a4;

    font-size:15px;

    line-height:1.8;
}

.features{
    display:grid;

    grid-template-columns:
    repeat(3,minmax(0,1fr));

    gap:15px;

    margin-top:30px;
}

.feature{
    padding:22px;

    border-radius:20px;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid
    rgba(255,255,255,.07);

    transition:.25s;
}

.feature:hover{
    transform:
    translateY(-4px);

    background:
    rgba(255,255,255,.07);
}

.feature-icon{
    width:44px;
    height:44px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
    rgba(110,140,255,.10);

    font-size:20px;
}

.feature h3{
    margin-top:14px;

    font-size:16px;
}

.feature p{
    margin-top:7px;

    color:#737f94;

    font-size:13px;

    line-height:1.6;
}


/* =========================================================
   CTA
========================================================= */

.cta{
    width:
    min(900px,calc(100% - 24px));

    margin:
    0 auto 90px;

    text-align:center;
}

.cta-box{
    padding:
    48px 20px;

    border-radius:29px;

    background:
    linear-gradient(
        135deg,
        rgba(110,140,255,.13),
        rgba(150,90,255,.07),
        rgba(255,255,255,.035)
    );

    border:
    1px solid
    rgba(140,165,255,.19);

    box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.10),

    0 25px 65px
    rgba(0,0,0,.20);

    backdrop-filter:
    blur(18px);

    -webkit-backdrop-filter:
    blur(18px);
}

.cta-box h2{
    font-size:30px;
}

.cta-box p{
    margin-top:10px;

    color:#7f8ca0;
}

.cta-button{
    display:inline-flex;

    align-items:center;

    margin-top:24px;

    padding:
    14px 21px;

    border-radius:15px;

    color:#fff;

    text-decoration:none;

    font-weight:700;

    background:
    linear-gradient(
        135deg,
        #6d8fff,
        #8b68ff
    );

    box-shadow:
    0 12px 32px
    rgba(80,105,255,.28);

    transition:.25s;
}

.cta-button:hover{
    transform:
    translateY(-4px);
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    padding:
    45px 20px 35px;

    text-align:center;

    background:
    rgba(2,4,9,.80);

    border-top:
    1px solid
    rgba(255,255,255,.07);
}

.footer-logo{
    font-size:24px;

    font-weight:900;
}

.footer-logo span{
    color:#8da6ff;
}

.footer-description{
    margin-top:8px;

    color:#687488;

    font-size:13px;
}

.footer-links{
    margin:
    22px 0;
}

.footer-links a{
    color:#7f8b9e;

    text-decoration:none;

    margin:
    0 8px;

    font-size:13px;

    transition:.2s;
}

.footer-links a:hover{
    color:#a1b3ff;
}

.copyright{
    color:#4f5b6e;

    font-size:11px;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1000px){

    .tools-grid{
        grid-template-columns:
        repeat(2,minmax(0,1fr));
    }

    .features{
        grid-template-columns:
        repeat(2,minmax(0,1fr));
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    /* PERFORMANCE */

    .glow{
        animation:none !important;

        filter:blur(40px) !important;

        opacity:.22;
    }

    .nav,
    .search-box input,
    .tool,
    .why-card,
    .cta-box{
        backdrop-filter:
        blur(10px) !important;

        -webkit-backdrop-filter:
        blur(10px) !important;
    }

    .hero-gradient{
        animation:none !important;

        background-position:
        center;
    }


    /* HEADER */

    header{
        width:
        calc(100% - 14px);

        top:7px;

        margin-top:7px;
    }

    .nav{
        min-height:60px;

        padding:
        8px 10px;

        border-radius:20px;
    }

    .logo{
        font-size:20px;
    }

    .logo-icon{
        width:34px;
        height:34px;

        border-radius:10px;
    }

    .nav-links{
        gap:1px;
    }

    .nav-links a{
        padding:
        8px 6px;

        font-size:11px;
    }


    /* HERO */

    .hero{
        padding:
        78px 8px 55px;
    }

    .hero h1{
        font-size:
        clamp(41px,13vw,62px);

        letter-spacing:-3px;
    }

    .hero-description{
        font-size:15px;

        line-height:1.7;
    }

    .search-box input{
        height:58px;

        border-radius:18px;
    }


    /* TOOLS */

    .tools-section{
        width:
        calc(100% - 18px);
    }

    .section-title h2{
        font-size:25px;
    }

    .tool-count{
        display:none;
    }

    .tools-grid{
        grid-template-columns:
        1fr !important;

        gap:14px !important;

        width:100% !important;

        max-height:none !important;

        overflow:visible !important;
    }

    .tool{
        display:block !important;

        visibility:visible !important;

        opacity:1 !important;

        min-height:185px;

        padding:22px;

        border-radius:22px;

        box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.09),

        0 10px 30px
        rgba(0,0,0,.15);
    }

    .tool:hover{
        transform:none;
    }

    .tool:hover .tool-icon{
        transform:none;
    }

    .tool:hover .tool-arrow{
        transform:none;
    }


    /* WHY */

    .why{
        width:
        calc(100% - 18px);

        margin:
        30px auto 60px;
    }

    .why-card{
        padding:
        28px 20px;

        border-radius:24px;
    }

    .why-card h2{
        font-size:27px;
    }

    .features{
        grid-template-columns:
        1fr;
    }


    /* CTA */

    .cta{
        width:
        calc(100% - 18px);

        margin-bottom:60px;
    }

    .cta-box{
        padding:
        40px 18px;

        border-radius:24px;
    }

    .cta-box h2{
        font-size:27px;
    }

}


/* =========================================================
   VERY SMALL DEVICES
========================================================= */

@media(max-width:400px){

    .glow{
        display:none;
    }

    .nav,
    .search-box input,
    .tool,
    .why-card,
    .cta-box{
        backdrop-filter:none !important;

        -webkit-backdrop-filter:none !important;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation:none !important;

        transition:none !important;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

    <div class="glow three"></div>

</div>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

<nav class="nav">

    <a
    href="index.html"
    class="logo">

        <span class="logo-icon">
            ✦
        </span>

        Tool<span class="logo-blue">
            Nova
        </span>

    </a>


    <div class="nav-links">

        <a href="#tools">
            Tools
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

    </div>

</nav>

</header>


<!-- =======================================================
     MAIN
======================================================= -->

<main>


<!-- =======================================================
     HERO
======================================================= -->

<section class="hero">


<div class="hero-badge">

    <span class="live-dot"></span>

    Free • Fast • No Account Required

</div>


<h1>

    <span class="hero-title">
        Everything You Need.
    </span>

    <span class="hero-gradient">
        All in One Place.
    </span>

</h1>


<p class="hero-description
