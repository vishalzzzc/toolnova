/* =========================================================
   TOOLNOVA — LIQUID GLASS HOMEPAGE
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Arial,
    sans-serif;

    color:#fff;

    background:
    radial-gradient(
        circle at 15% 10%,
        rgba(73,112,255,.22),
        transparent 30%
    ),
    radial-gradient(
        circle at 85% 20%,
        rgba(166,90,255,.18),
        transparent 30%
    ),
    radial-gradient(
        circle at 50% 90%,
        rgba(55,170,255,.12),
        transparent 30%
    ),
    #05070d;
}


/* =========================================================
   BACKGROUND LIGHT
========================================================= */

.background{
    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-10;
}

.glow{
    position:absolute;

    border-radius:50%;

    filter:blur(80px);

    opacity:.35;

    animation:
    moveGlow 15s ease-in-out infinite alternate;
}

.glow.one{
    width:360px;
    height:360px;

    top:-120px;
    left:-100px;

    background:#3568ff;
}

.glow.two{
    width:330px;
    height:330px;

    top:25%;
    right:-120px;

    background:#9b4dff;

    animation-delay:-5s;
}

.glow.three{
    width:300px;
    height:300px;

    bottom:-120px;
    left:35%;

    background:#168cff;

    animation-delay:-9s;
}

@keyframes moveGlow{

    0%{
        transform:
        translate3d(0,0,0)
        scale(1);
    }

    50%{
        transform:
        translate3d(60px,-40px,0)
        scale(1.15);
    }

    100%{
        transform:
        translate3d(-40px,60px,0)
        scale(.9);
    }

}


/* =========================================================
   NOISE
========================================================= */

.noise{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:-5;

    opacity:.025;

    background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}


/* =========================================================
   FLOATING PARTICLES
========================================================= */

.particles{
    position:fixed;
    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:-4;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#9eb4ff;

    opacity:.5;

    animation:
    particleFloat 12s ease-in-out infinite;
}

.particle:nth-child(1){
    left:7%;
    top:28%;
}

.particle:nth-child(2){
    left:18%;
    top:70%;
    animation-duration:17s;
}

.particle:nth-child(3){
    left:31%;
    top:16%;
    animation-duration:14s;
}

.particle:nth-child(4){
    left:44%;
    top:78%;
    animation-duration:19s;
}

.particle:nth-child(5){
    left:58%;
    top:32%;
    animation-duration:15s;
}

.particle:nth-child(6){
    left:72%;
    top:72%;
    animation-duration:18s;
}

.particle:nth-child(7){
    left:86%;
    top:24%;
    animation-duration:13s;
}

.particle:nth-child(8){
    left:94%;
    top:57%;
    animation-duration:21s;
}

@keyframes particleFloat{

    0%,100%{
        transform:
        translate(0,0);
    }

    50%{
        transform:
        translate(35px,-80px);
    }

}


/* =========================================================
   GLASS COMMON
========================================================= */

.glass{
    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.105),
        rgba(255,255,255,.035)

    1px solid

    inset 0 1px 0
    rgba(255,255,255,.12),

    inset 0 -1px 0
    rgba(255,255,255,.025),

    0 25px 80px

    backdrop-filter:
    blur(28px)
    saturate(150%);

    -webkit-backdrop-filter:
    blur(28px)
    saturate(150%);
}

/* =========================================================
   TOOL CARD
========================================================= */

.tool{

    position:relative;

    min-height:208px;

    overflow:hidden;

    padding:24px;

    border-radius:25px;

    text-decoration:none;

    color:#fff;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.105),
        rgba(255,255,255,.035)
    );

    border:
    1px solid
    rgba(255,255,255,.12);

    box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.12),

    0 18px 55px
    rgba(0,0,0,.18);

    backdrop-filter:
    blur(25px)
    saturate(150%);

    -webkit-backdrop-filter:
    blur(25px)
    saturate(150%);

    transform:
    translateZ(0);

    transition:
    transform .35s cubic-bezier(.2,.8,.2,1),
    border-color .35s,
    box-shadow .35s,
    background .35s;
}

.tool::before{

    content:"";

    position:absolute;

    width:170px;
    height:170px;

    right:-90px;
    top:-90px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(125,151,255,.3),
        transparent 70%
    );

    opacity:.65;

    transition:.5s;
}

.tool::after{

    content:"";

    position:absolute;

    inset:0;

    border-radius:inherit;

    pointer-events:none;

    background:
    linear-gradient(
        120deg,
        transparent 25%,
        rgba(255,255,255,.08) 50%,
        transparent 75%
    );

    transform:
    translateX(-130%);

    transition:
    transform .7s ease;
}

.tool:hover::after{

    transform:
    translateX(130%);
}

.tool:hover{

    transform:
    translateY(-9px)
    scale(1.015);

    border-color:
    rgba(151,171,255,.42);

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.14),
        rgba(255,255,255,.05)
    );

    box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.18),

    0 30px 70px
    rgba(0,0,0,.3),

    0 0 35px
    rgba(91,119,255,.10);
}

.tool:hover::before{

    transform:
    scale(1.6);

    opacity:1;
}
