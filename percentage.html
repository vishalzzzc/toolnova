<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Percentage Calculator - ToolNova</title>
  <meta name="description" content="Calculate percentages quickly and easily with ToolNova's free online percentage calculator.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #252e40;
    }

    .nav {
      max-width: 900px;
      margin: auto;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #718cff;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
    }

    .back {
      color: #8da5ff;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 25px;
    }

    .card {
      background: #141a28;
      border: 1px solid #293348;
      border-radius: 20px;
      padding: 28px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .description {
      color: #929caf;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd2df;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 1px solid #354057;
      background: #0d1320;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #718cff;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #718cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 14px;
      background: #18233a;
      text-align: center;
    }

    .result span {
      color: #8da5ff;
      font-size: 30px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #687287;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">Tool<span>Nova</span></div>
  </div>
</header>

<div class="container">

  <a class="back" href="index.html">← Back to all tools</a>

  <div class="card">

    <h1>Percentage Calculator</h1>

    <p class="description">
      Calculate a percentage of any number instantly.
    </p>

    <label for="percentage">Percentage (%)</label>
    <input
      type="number"
      id="percentage"
      placeholder="Example: 20"
    >

    <label for="number">Number</label>
    <input
      type="number"
      id="number"
      placeholder="Example: 500"
    >

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="result">
      Result<br>
      <span id="answer">0</span>
    </div>

  </div>

</div>

<footer>
  ToolNova — Free Tools. Simple. Fast.
</footer>

<script>
  function calculate() {

    const percentage =
      parseFloat(document.getElementById("percentage").value);

    const number =
      parseFloat(document.getElementById("number").value);

    if (isNaN(percentage) || isNaN(number)) {
      alert("Please enter both numbers.");
      return;
    }

    const result = (percentage / 100) * number;

    document.getElementById("answer").textContent =
      result.toLocaleString();

    document.getElementById("result").style.display = "block";
  }
</script>

</body>
</html>
