<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Age Calculator - ToolNova</title>

  <meta
    name="description"
    content="Calculate your exact age in years, months and days with ToolNova's free online age calculator."
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px 18px;
      border-bottom: 1px solid #202737;
    }

    .nav {
      max-width: 900px;
      margin: auto;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
    }

    .logo span {
      color: #718cff;
    }

    .container {
      max-width: 650px;
      margin: 45px auto;
      padding: 20px;
    }

    .back {
      color: #8da5ff;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 25px;
    }

    .card {
      background: #141a28;
      border: 1px solid #293348;
      border-radius: 20px;
      padding: 28px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .description {
      color: #929caf;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd2df;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 22px;
      border-radius: 12px;
      border: 1px solid #354057;
      background: #0d1320;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #718cff;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #718cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 22px;
      border-radius: 15px;
      background: #18233a;
      text-align: center;
    }

    .result h2 {
      margin-bottom: 15px;
    }

    .age {
      color: #8da5ff;
      font-size: 25px;
      font-weight: bold;
      line-height: 1.7;
    }

    .details {
      margin-top: 18px;
      color: #aeb7c9;
      font-size: 14px;
      line-height: 1.7;
    }

    .error {
      display: none;
      color: #ff8d8d;
      margin-top: 15px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #687287;
      padding: 30px;
      font-size: 13px;
    }

  </style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      Tool<span>Nova</span>
    </div>

  </div>

</header>


<div class="container">

  <a
    class="back"
    href="index.html"
  >
    ← Back to all tools
  </a>


  <div class="card">

    <h1>
      🎂 Age Calculator
    </h1>

    <p class="description">
      Enter your date of birth to calculate your exact age
      in years, months and days.
    </p>


    <label for="dob">
      Date of Birth
    </label>

    <input
      type="date"
      id="dob"
    >


    <button onclick="calculateAge()">
      Calculate Age
    </button>


    <div
      class="error"
      id="error"
    >
      Please enter a valid date of birth.
    </div>


    <div
      class="result"
      id="result"
    >

      <h2>
        Your Exact Age
      </h2>

      <div
        class="age"
        id="ageResult"
      ></div>

      <div
        class="details"
        id="details"
      ></div>

    </div>

  </div>

</div>


<footer>

  ToolNova — Free Tools. Simple. Fast.

</footer>


<script>

function calculateAge() {

  const input =
    document.getElementById("dob").value;

  const error =
    document.getElementById("error");

  const result =
    document.getElementById("result");

  const ageResult =
    document.getElementById("ageResult");

  const details =
    document.getElementById("details");


  if (!input) {

    error.style.display = "block";
    result.style.display = "none";

    return;
  }


  const dob =
    new Date(input + "T00:00:00");


  const today =
    new Date();


  if (dob > today) {

    error.style.display = "block";
    result.style.display = "none";

    return;
  }


  let years =
    today.getFullYear() -
    dob.getFullYear();


  let months =
    today.getMonth() -
    dob.getMonth();


  let days =
    today.getDate() -
    dob.getDate();


  if (days < 0) {

    months--;

    const previousMonth =
      new Date(
        today.getFullYear(),
        today.getMonth(),
        0
      );

    days += previousMonth.getDate();

  }


  if (months < 0) {

    years--;
    months += 12;

  }


  const totalDays =
    Math.floor(
      (today - dob) /
      (1000 * 60 * 60 * 24)
    );


  error.style.display = "none";

  result.style.display = "block";


  ageResult.innerHTML =
    years + " Years<br>" +
    months + " Months<br>" +
    days + " Days";


  details.innerHTML =
    "Approximately " +
    totalDays.toLocaleString() +
    " days old.";

}

</script>

</body>
</html>
