<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Age Calculator - ToolNova</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
}

header {
  padding: 20px;
  border-bottom: 1px solid #293348;
}

.logo {
  font-size: 26px;
  font-weight: bold;
}

.logo span {
  color: #718cff;
}

.container {
  max-width: 600px;
  margin: 50px auto;
  padding: 20px;
}

.back {
  color: #8da5ff;
  text-decoration: none;
}

.card {
  margin-top: 25px;
  background: #141a28;
  border: 1px solid #293348;
  border-radius: 20px;
  padding: 30px;
}

h1 {
  margin-top: 0;
}

p {
  color: #9da7bb;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 15px;
  margin: 20px 0;
  background: #0d1320;
  color: white;
  border: 1px solid #354057;
  border-radius: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 16px;
  background: #718cff;
  color: white;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
}

#result {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: #18233a;
  border-radius: 15px;
  text-align: center;
}

#answer {
  color: #8da5ff;
  font-size: 25px;
  font-weight: bold;
  line-height: 1.7;
}

footer {
  text-align: center;
  color: #687287;
  padding: 30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    Tool<span>Nova</span>
  </div>
</header>

<div class="container">

<a href="index.html" class="back">
← Back to ToolNova
</a>

<div class="card">

<h1>🎂 Age Calculator</h1>

<p>
Enter your date of birth and calculate your exact age.
</p>

<input type="date" id="dob">

<button onclick="calculateAge()">
Calculate Age
</button>

<div id="result">

<h2>Your Age</h2>

<div id="answer"></div>

</div>

</div>

</div>

<footer>
ToolNova — Free Tools. Simple. Fast.
</footer>

<script>

function calculateAge() {

var value = document.getElementById("dob").value;

if (!value) {
alert("Please select your date of birth.");
return;
}

var dob = new Date(value);
var today = new Date();

var years = today.getFullYear() - dob.getFullYear();

var months = today.getMonth() - dob.getMonth();

var days = today.getDate() - dob.getDate();

if (days < 0) {
months--;
days += new Date(
today.getFullYear(),
today.getMonth(),
0
).getDate();
}

if (months < 0) {
years--;
months += 12;
}

if (dob > today) {
alert("Date of birth cannot be in the future.");
return;
}

document.getElementById("answer").innerHTML =
years + " Years<br>" +
months + " Months<br>" +
days + " Days";

document.getElementById("result").style.display = "block";

}

</script>

</body>
</html>
