<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact ToolNova</title>

<meta name="description"
content="Contact ToolNova for feedback, suggestions, questions and website issues.">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
  line-height: 1.7;
}

header {
  padding: 20px;
  border-bottom: 1px solid #293348;
}

.logo {
  max-width: 700px;
  margin: auto;
  font-size: 26px;
  font-weight: bold;
}

.logo span {
  color: #718cff;
}

.container {
  max-width: 650px;
  margin: 40px auto;
  padding: 20px;
}

.back {
  color: #8da5ff;
  text-decoration: none;
}

.card {
  margin-top: 25px;
  background: #141a28;
  border: 1px solid #293348;
  border-radius: 20px;
  padding: 30px;
}

h1 {
  margin-top: 0;
}

.description {
  color: #aeb7c9;
}

label {
  display: block;
  margin-top: 20px;
  margin-bottom: 8px;
}

input,
textarea {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #354057;
  background: #0d1320;
  color: white;
  font-size: 16px;
  outline: none;
}

textarea {
  min-height: 160px;
  resize: vertical;
}

input:focus,
textarea:focus {
  border-color: #718cff;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #718cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.note {
  margin-top: 18px;
  color: #788297;
  font-size: 13px;
}

footer {
  border-top: 1px solid #293348;
  text-align: center;
  color: #687287;
  padding: 30px 15px;
}

footer a {
  color: #8da5ff;
  text-decoration: none;
  margin: 0 8px;
}

</style>

</head>

<body>

<header>

<div class="logo">
Tool<span>Nova</span>
</div>

</header>


<div class="container">

<a href="index.html" class="back">
← Back to ToolNova
</a>


<div class="card">

<h1>📩 Contact ToolNova</h1>

<p class="description">
Have a suggestion, feedback, question or found an issue?
Send us a message using the form below.
</p>


<form
action="https://formsubmit.co/vk92205095@gmail.com"
method="POST">

<input
type="hidden"
name="_subject"
value="New ToolNova Contact Message">

<input
type="hidden"
name="_captcha"
value="true">

<input
type="hidden"
name="_template"
value="table">

<input
type="hidden"
name="_next"
value="https://vishalzzzc.github.io/toolnova/contact.html">

<label for="name">
Name
</label>

<input
type="text"
id="name"
name="name"
placeholder="Enter your name"
required>


<label for="email">
Email
</label>

<input
type="email"
id="email"
name="email"
placeholder="Enter your email"
required>


<label for="message">
Message
</label>

<textarea
id="message"
name="message"
placeholder="Write your message..."
required></textarea>


<button type="submit">
Send Message
</button>

</form>


<p class="note">
We will use the information provided through this form only
to respond to your message.
</p>

</div>

</div>


<footer>

ToolNova — Free Tools. Simple. Fast.

<br><br>

<a href="index.html">Home</a>

<a href="about.html">About</a>

<a href="privacy.html">Privacy Policy</a>

</footer>

</body>
</html>
