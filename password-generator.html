<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator - ToolNova</title>

<meta name="description" content="Generate strong random passwords instantly with ToolNova's free password generator.">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
}

header {
  padding: 20px;
  border-bottom: 1px solid #293348;
}

.logo {
  max-width: 700px;
  margin: auto;
  font-size: 26px;
  font-weight: bold;
}

.logo span {
  color: #718cff;
}

.container {
  max-width: 650px;
  margin: 45px auto;
  padding: 20px;
}

.back {
  color: #8da5ff;
  text-decoration: none;
}

.card {
  margin-top: 25px;
  background: #141a28;
  border: 1px solid #293348;
  border-radius: 20px;
  padding: 25px;
}

h1 {
  margin-top: 0;
}

.description {
  color: #9da7bb;
  line-height: 1.6;
}

.password-box {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}

.password {
  flex: 1;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #354057;
  background: #0d1320;
  color: white;
  font-size: 16px;
}

.copy {
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #27334d;
  color: white;
  cursor: pointer;
}

.setting {
  margin-top: 25px;
}

.setting label {
  display: block;
  margin-bottom: 10px;
  color: #cbd2df;
}

input[type="range"] {
  width: 100%;
}

.options {
  margin-top: 20px;
}

.option {
  margin: 12px 0;
  color: #b7c0d1;
}

.option input {
  margin-right: 8px;
}

.generate {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #718cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#lengthValue {
  color: #8da5ff;
  font-weight: bold;
}

footer {
  text-align: center;
  color: #687287;
  padding: 30px;
  font-size: 13px;
}

@media (max-width: 500px) {

  .password-box {
    flex-direction: column;
  }

  .copy {
    width: 100%;
  }

}

</style>
</head>

<body>

<header>

<div class="logo">
Tool<span>Nova</span>
</div>

</header>


<div class="container">

<a href="index.html" class="back">
← Back to ToolNova
</a>


<div class="card">

<h1>🔐 Password Generator</h1>

<p class="description">
Create strong random passwords instantly.
Your password is generated directly in your browser.
</p>


<div class="password-box">

<input
class="password"
id="password"
type="text"
readonly
placeholder="Your password will appear here"
>

<button
class="copy"
onclick="copyPassword()">

Copy

</button>

</div>


<div class="setting">

<label>
Password Length:
<strong id="lengthValue">16</strong>
</label>

<input
type="range"
id="length"
min="6"
max="50"
value="16"
oninput="updateLength()"
>

</div>


<div class="options">

<div class="option">

<label>
<input
type="checkbox"
id="uppercase"
checked
>

Uppercase Letters (A-Z)

</label>

</div>


<div class="option">

<label>
<input
type="checkbox"
id="lowercase"
checked
>

Lowercase Letters (a-z)

</label>

</div>


<div class="option">

<label>
<input
type="checkbox"
id="numbers"
checked
>

Numbers (0-9)

</label>

</div>


<div class="option">

<label>
<input
type="checkbox"
id="symbols"
checked
>

Symbols (!@#$...)

</label>

</div>

</div>


<button
class="generate"
onclick="generatePassword()">

Generate Password

</button>

</div>

</div>


<footer>

ToolNova — Free Tools. Simple. Fast.

</footer>


<script>

function updateLength() {

const length =
document.getElementById("length").value;

document.getElementById("lengthValue")
.textContent = length;

}


function generatePassword() {

const length =
parseInt(
document.getElementById("length").value
);

const uppercase =
document.getElementById("uppercase").checked;

const lowercase =
document.getElementById("lowercase").checked;

const numbers =
document.getElementById("numbers").checked;

const symbols =
document.getElementById("symbols").checked;


let characters = "";

if (uppercase) {
characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
}

if (lowercase) {
characters += "abcdefghijklmnopqrstuvwxyz";
}

if (numbers) {
characters += "0123456789";
}

if (symbols) {
characters += "!@#$%^&*()_+-=[]{}|;:,.<>?";
}


if (characters.length === 0) {

alert("Select at least one character type.");

return;

}


let password = "";

const randomArray =
new Uint32Array(length);

window.crypto.getRandomValues(randomArray);


for (let i = 0; i < length; i++) {

password +=
characters[randomArray[i] % characters.length];

}


document.getElementById("password")
.value = password;

}


function copyPassword() {

const password =
document.getElementById("password").value;

if (!password) {

alert("Generate a password first.");

return;

}


navigator.clipboard.writeText(password)
.then(function() {

alert("Password copied!");

})
.catch(function() {

alert("Copy failed. Please copy it manually.");

});

}


generatePassword();

</script>

</body>
</html>
