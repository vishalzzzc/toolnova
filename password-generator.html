<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator - Strong Random Passwords | ToolNova</title>

<meta name="description"
content="Generate strong random passwords online for free. Choose password length and include uppercase, lowercase, numbers and symbols with ToolNova.">

<meta name="robots" content="index, follow">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
  line-height: 1.6;
}

header {
  padding: 20px;
  border-bottom: 1px solid #293348;
}

.logo {
  max-width: 850px;
  margin: auto;
  font-size: 26px;
  font-weight: bold;
}

.logo span {
  color: #718cff;
}

.container {
  max-width: 800px;
  margin: 40px auto;
  padding: 20px;
}

.back {
  color: #8da5ff;
  text-decoration: none;
}

.card {
  margin-top: 25px;
  background: #141a28;
  border: 1px solid #293348;
  border-radius: 20px;
  padding: 28px;
}

h1 {
  margin-top: 0;
  font-size: 34px;
}

.description {
  color: #9da7bb;
}

.password-box {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}

.password-box input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #354057;
  background: #0d1320;
  color: white;
  font-size: 16px;
  outline: none;
}

.copy-btn {
  width: auto;
  margin: 0;
  padding: 0 20px;
}

.options {
  margin-top: 25px;
  background: #111827;
  border: 1px solid #293348;
  border-radius: 16px;
  padding: 20px;
}

.option {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 14px 0;
  color: #cbd2df;
}

.option input {
  width: 18px;
  height: 18px;
}

.length-row {
  display: flex;
  align-items: center;
  gap: 15px;
}

.length-row input {
  flex: 1;
}

.length-number {
  min-width: 45px;
  color: #8da5ff;
  font-weight: bold;
}

input[type="range"] {
  accent-color: #718cff;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #718cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

.strength {
  margin-top: 18px;
  padding: 15px;
  background: #18233a;
  border-radius: 12px;
  text-align: center;
}

.strength-text {
  color: #8da5ff;
  font-weight: bold;
}

.content {
  margin-top: 35px;
  padding: 25px;
  background: #111827;
  border: 1px solid #293348;
  border-radius: 18px;
}

.content h2 {
  color: #8da5ff;
  margin-top: 25px;
}

.content h2:first-child {
  margin-top: 0;
}

.content p,
.content li {
  color: #aeb7c9;
}

.faq {
  margin-top: 12px;
  padding: 15px;
  background: #141a28;
  border-radius: 12px;
}

.faq strong {
  display: block;
  margin-bottom: 5px;
}

footer {
  border-top: 1px solid #293348;
  text-align: center;
  padding: 30px 15px;
  color: #687287;
}

footer a {
  color: #8da5ff;
  text-decoration: none;
  margin: 0 8px;
}

@media (max-width: 550px) {

  .container {
    padding: 15px;
  }

  .card,
  .content {
    padding: 20px;
  }

  h1 {
    font-size: 29px;
  }

  .password-box {
    flex-direction: column;
  }

  .copy-btn {
    width: 100%;
    padding: 15px;
  }

}

</style>

</head>

<body>

<header>

<div class="logo">
Tool<span>Nova</span>
