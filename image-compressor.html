<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Compressor - Compress Images Online | ToolNova</title>

<meta name="description"
content="Compress JPG, PNG and WebP images online for free. Reduce image file size while keeping good quality with ToolNova.">

<meta name="robots" content="index, follow">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
  line-height: 1.6;
}

header {
  padding: 20px;
  border-bottom: 1px solid #293348;
}

.logo {
  max-width: 850px;
  margin: auto;
  font-size: 26px;
  font-weight: bold;
}

.logo span {
  color: #718cff;
}

.container {
  max-width: 850px;
  margin: 40px auto;
  padding: 20px;
}

.back {
  color: #8da5ff;
  text-decoration: none;
}

.card {
  margin-top: 25px;
  background: #141a28;
  border: 1px solid #293348;
  border-radius: 20px;
  padding: 28px;
}

h1 {
  margin-top: 0;
  font-size: 34px;
}

.description {
  color: #9da7bb;
}

.upload {
  margin-top: 25px;
  padding: 30px 20px;
  border: 2px dashed #354057;
  border-radius: 16px;
  text-align: center;
}

.upload input {
  display: none;
}

.upload label {
  display: inline-block;
  padding: 15px 22px;
  border-radius: 12px;
  background: #718cff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.file-name {
  margin-top: 15px;
  color: #9da7bb;
  word-break: break-word;
}

.controls {
  display: none;
  margin-top: 25px;
}

.quality-row {
  display: flex;
  align-items: center;
  gap: 15px;
}

.quality-row input {
  flex: 1;
}

.quality-value {
  min-width: 55px;
  color: #8da5ff;
  font-weight: bold;
}

input[type="range"] {
  accent-color: #718cff;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #718cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #27334d;
}

button:hover {
  opacity: .9;
}

.result {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: #111827;
  border: 1px solid #293348;
  border-radius: 16px;
}

.result p {
  color: #aeb7c9;
}

.preview {
  max-width: 100%;
  max-height: 300px;
  display: block;
  margin: 20px auto;
  border-radius: 12px;
}

.download {
  display: none;
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border-radius: 12px;
  background: #718cff;
  color: white;
  text-decoration: none;
  text-align: center;
  font-weight: bold;
}

.error {
  color: #ff8585;
  text-align: center;
  margin-top: 15px;
}

.content {
  margin-top: 35px;
  padding: 25px;
  background: #111827;
  border: 1px solid #293348;
  border-radius: 18px;
}

.content h2 {
  color: #8da5ff;
  margin-top: 25px;
}

.content h2:first-child {
  margin-top: 0;
}

.content p,
.content li {
  color: #aeb7c9;
}

.faq {
  margin-top: 12px;
  padding: 15px;
  background: #141a28;
  border-radius: 12px;
}

.faq strong {
  display: block;
  margin-bottom: 5px;
}

footer {
  border-top: 1px solid #293348;
  text-align: center;
  padding: 30px 15px;
  color: #687287;
}

footer a {
  color: #8da5ff;
  text-decoration: none;
  margin: 0 8px;
}

@media (max-width: 550px) {

  .container {
    padding: 15px;
  }

  .card,
  .content {
    padding: 20px;
  }

  h1 {
    font-size: 29px;
  }

}

</style>

</head>

<body>

<header>

<div class="logo">
Tool<span>Nova</span>
</div>

</header>


<div class="container">

<a href="index.html" class="back">
← Back to ToolNova
</a>


<div class="card">

<h1>🖼️ Image Compressor</h1>

<p class="description">
Compress JPG, PNG and WebP images directly in your browser.
No account is required.
</p>


<div class="upload">

<label for="imageInput">
📁 Choose Image
</label>

<input
type="file"
id="imageInput"
accept="image/jpeg,image/png,image/webp">

<div
class="file-name"
id="fileName">
No image selected
</div>

</div>


<div
class="controls"
id="controls">

<label for="quality">
Compression Quality
</label>

<div class="quality-row">

<input
type="range"
id="quality"
min="10"
max="100"
value="80"
oninput="updateQuality()">

<span
class="quality-value"
id="qualityValue">
80%
</span>

</div>


<button onclick="compressImage()">
⚡ Compress Image
</button>

<button
class="secondary"
onclick="resetTool()">
Reset
</button>

</div>


<div
class="error"
id="error">
</div>


<div
class="result"
id="result">
