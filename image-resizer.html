<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Resizer - Resize Images Online | ToolNova</title>

<meta name="description"
content="Resize JPG, PNG and WebP images online for free. Set custom width and height and download the resized image with ToolNova.">

<meta name="robots" content="index, follow">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
  line-height: 1.6;
}

header {
  padding: 20px;
  border-bottom: 1px solid #293348;
}

.logo {
  max-width: 850px;
  margin: auto;
  font-size: 26px;
  font-weight: bold;
}

.logo span {
  color: #718cff;
}

.container {
  max-width: 850px;
  margin: 40px auto;
  padding: 20px;
}

.back {
  color: #8da5ff;
  text-decoration: none;
}

.card {
  margin-top: 25px;
  background: #141a28;
  border: 1px solid #293348;
  border-radius: 20px;
  padding: 28px;
}

h1 {
  margin-top: 0;
  font-size: 34px;
}

.description {
  color: #9da7bb;
}

.upload {
  margin-top: 25px;
  padding: 30px 20px;
  border: 2px dashed #354057;
  border-radius: 16px;
  text-align: center;
}

.upload input {
  display: none;
}

.upload label {
  display: inline-block;
  padding: 15px 22px;
  border-radius: 12px;
  background: #718cff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.file-name {
  margin-top: 15px;
  color: #9da7bb;
  word-break: break-word;
}

.controls {
  display: none;
  margin-top: 25px;
}

.dimensions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

label.field-label {
  display: block;
  margin-bottom: 8px;
  color: #cbd2df;
}

input[type="number"] {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #354057;
  background: #0d1320;
  color: white;
  font-size: 16px;
  outline: none;
}

input[type="number"]:focus {
  border-color: #718cff;
}

.option {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
  color: #cbd2df;
}

.option input {
  width: 18px;
  height: 18px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #718cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #27334d;
}

button:hover {
  opacity: .9;
}

.result {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: #111827;
  border: 1px solid #293348;
  border-radius: 16px;
}

.preview {
  max-width: 100%;
  max-height: 350px;
  display: block;
  margin: 20px auto;
  border-radius: 12px;
  background: white;
}

.result p {
  color: #aeb7c9;
}

.download {
  display: none;
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border-radius: 12px;
  background: #718cff;
  color: white;
  text-decoration: none;
  text-align: center;
  font-weight: bold;
}

.error {
  color: #ff8585;
  text-align: center;
  margin-top: 15px;
}

.content {
  margin-top: 35px;
  padding: 25px;
  background: #111827;
  border: 1px solid #293348;
  border-radius: 18px;
}

.content h2 {
  color: #8da5ff;
  margin-top: 25px;
}

.content h2:first-child {
  margin-top: 0;
}

.content p,
.content li {
  color: #aeb7c9;
}

.faq {
  margin-top: 12px;
  padding: 15px;
  background: #141a28;
  border-radius: 12px;
}

.faq strong {
  display: block;
  margin-bottom: 5px;
}

footer {
  border-top: 1px solid #293348;
  text-align: center;
  padding: 30px 15px;
  color: #687287;
}

footer a {
  color: #8da5ff;
  text-decoration: none;
  margin: 0 8px;
}

@media (max-width: 550px) {

  .container {
    padding: 15px;
  }

  .card,
  .content {
    padding: 20px;
  }

  h1 {
    font-size: 29px;
  }

  .dimensions {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<header>

<div class="logo">
Tool<span>Nova</span>
</div>

</header>


<div class="container">

<a href="index.html" class="back">
← Back to ToolNova
</a>


<div class="card">

<h1>📐 Image Resizer</h1>

<p class="description">
Resize JPG, PNG and WebP images to custom dimensions directly
in your browser.
</p>


<div class="upload">

<label for="imageInput">
📁 Choose Image
</label>

<input
type="file"
id="imageInput"
accept="image/jpeg,image/png,image/webp">

<div
class="file-name"
id="fileName">
No image selected
</div>

</div>


<div
class="controls"
id="controls">

<div class="dimensions">

<div>

<label
class="field-label"
for="width">
Width (px)
</label>

<input
type="number"
id="width"
min="1"
placeholder="Width">

</div>


<div>

<label
class="field-label"
for="height">
Height (px)
</label>

<input
type="number"
id="height"
min="1"
placeholder="Height">

</div>

</div>


<label
