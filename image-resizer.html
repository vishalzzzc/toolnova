<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Resizer - ToolNova</title>

<meta name="description" content="Resize images online for free. Set custom width and height and download your resized image with ToolNova.">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
}

header {
  padding: 20px;
  border-bottom: 1px solid #293348;
}

.logo {
  max-width: 700px;
  margin: auto;
  font-size: 26px;
  font-weight: bold;
}

.logo span {
  color: #718cff;
}

.container {
  max-width: 700px;
  margin: 45px auto;
  padding: 20px;
}

.back {
  color: #8da5ff;
  text-decoration: none;
}

.card {
  margin-top: 25px;
  background: #141a28;
  border: 1px solid #293348;
  border-radius: 20px;
  padding: 25px;
}

h1 {
  margin-top: 0;
}

.description {
  color: #9da7bb;
  line-height: 1.6;
}

.upload {
  margin-top: 25px;
  border: 2px dashed #354057;
  border-radius: 15px;
  padding: 30px 20px;
  text-align: center;
}

input[type="file"] {
  width: 100%;
  margin-top: 20px;
  color: #cbd2df;
}

.preview {
  display: none;
  margin-top: 25px;
  text-align: center;
}

.preview img {
  max-width: 100%;
  max-height: 280px;
  border-radius: 12px;
}

.original {
  color: #9da7bb;
  font-size: 14px;
  margin-top: 10px;
}

.dimensions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 25px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  color: #cbd2df;
}

.field input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #354057;
  background: #0d1320;
  color: white;
  font-size: 16px;
  outline: none;
}

.lock {
  margin-top: 15px;
  color: #aeb7c9;
  font-size: 14px;
}

.lock input {
  margin-right: 8px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #718cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.download {
  display: none;
  text-decoration: none;
  text-align: center;
  margin-top: 15px;
  padding: 15px;
  border-radius: 12px;
  background: #27334d;
  color: white;
}

.error {
  color: #ff8585;
  text-align: center;
  margin-top: 15px;
}

.info {
  margin-top: 18px;
  color: #8f99ad;
  font-size: 13px;
  line-height: 1.6;
}

footer {
  text-align: center;
  color: #687287;
  padding: 30px;
  font-size: 13px;
}

@media (max-width: 500px) {
  .dimensions {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    Tool<span>Nova</span>
  </div>
</header>

<div class="container">

<a href="index.html" class="back">
← Back to ToolNova
</a>

<div class="card">

<h1>📐 Image Resizer</h1>

<p class="description">
Resize your image to any width and height directly in your browser.
</p>

<div class="upload">

<strong>
Choose an image
</strong>

<input
type="file"
id="imageInput"
accept="image/jpeg,image/png,image/webp"
>

</div>

<div class="preview" id="preview">

<img id="previewImage">

<div class="original" id="originalInfo"></div>

</div>

<div class="dimensions">

<div class="field">

<label for="width">
Width (px)
</label>

<input
type="number"
id="width"
min="1"
placeholder="Width"
oninput="widthChanged()"
>

</div>

<div class="field">

<label for="height">
Height (px)
</label>

<input
type="number"
id="height"
min="1"
placeholder="Height"
oninput="heightChanged()"
>

</div>

</div>

<div class="lock">

<label>

<input
type="checkbox"
id="lockRatio"
checked
>

Lock aspect ratio

</label>

</div>

<button
id="resizeButton"
onclick="resizeImage()"
disabled>

Resize Image

</button>

<a
id="downloadButton"
class="download"
download="toolnova-resized-image.png">

⬇️ Download Resized Image

</a>

<div
class="error"
id="error">
</div>

<div class="info">
Your image is processed locally in your browser.
It is not uploaded to a server.
</div>

</div>

</div>

<footer>
ToolNova — Free Tools. Simple. Fast.
</footer>

<script>

let image = null;

let originalWidth = 0;

let originalHeight = 0;

let ratio = 1;


document
.getElementById("imageInput")
.addEventListener("change", function(event) {

const file = event.target.files[0];

if (!file) {
return;
}

const reader = new FileReader();

reader.onload = function(e) {

image = new Image();

image.onload = function() {

originalWidth = image.naturalWidth;

originalHeight = image.naturalHeight;

ratio =
originalWidth / originalHeight;

document.getElementById("width").value =
originalWidth;

document.getElementById("height").value =
originalHeight;

document.getElementById("previewImage").src =
e.target.result;

document.getElementById("preview").style.display =
"block";

document.getElementById("resizeButton").disabled =
false;

document.getElementById("originalInfo").textContent =
"Original: " +
originalWidth +
" × " +
originalHeight +
" px";

document.getElementById("error").textContent =
"";

};

image.src = e.target.result;

};

reader.readAsDataURL(file);

});


function widthChanged() {

if (!document.getElementById("lockRatio").checked) {
return;
}

const width =
parseInt(document.getElementById("width").value);

if (!width) {
return;
}

document.getElementById("height").value =
Math.round(width / ratio);

}


function heightChanged() {

if (!document.getElementById("lockRatio").checked) {
return;
}

const height =
parseInt(document.getElementById("height").value);

if (!height) {
return;
}

document.getElementById("width").value =
Math.round(height * ratio);

}


function resizeImage() {

if (!image) {
return;
}

const width =
parseInt(document.getElementById("width").value);

const height =
parseInt(document.getElementById("height").value);

if (
!width ||
!height ||
width < 1 ||
height < 1
) {

document.getElementById("error").textContent =
"Please enter valid dimensions.";

return;

}

const canvas =
document.createElement("canvas");

canvas.width = width;

canvas.height = height;

const context =
canvas.getContext("2d");

context.drawImage(
image,
0,
0,
width,
height
);

canvas.toBlob(function(blob) {

if (!blob) {

document.getElementById("error").textContent =
"Resize failed.";

return;

}

const url =
URL.createObjectURL(blob);

const download =
document.getElementById("downloadButton");

download.href = url;

download.style.display = "block";

document.getElementById("error").textContent =
"";

}, "image/png");

}

</script>

</body>
</html>
