<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unit Converter - ToolNova</title>

<meta name="description" content="Free online unit converter for length, weight, temperature and data.">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
}

header {
  padding: 20px;
  border-bottom: 1px solid #293348;
}

.logo {
  max-width: 700px;
  margin: auto;
  font-size: 26px;
  font-weight: bold;
}

.logo span {
  color: #718cff;
}

.container {
  max-width: 700px;
  margin: 45px auto;
  padding: 20px;
}

.back {
  color: #8da5ff;
  text-decoration: none;
}

.card {
  margin-top: 25px;
  background: #141a28;
  border: 1px solid #293348;
  border-radius: 20px;
  padding: 28px;
}

h1 {
  margin-top: 0;
}

.description {
  color: #9da7bb;
  line-height: 1.6;
}

select,
input {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border-radius: 12px;
  border: 1px solid #354057;
  background: #0d1320;
  color: white;
  font-size: 16px;
  outline: none;
}

label {
  display: block;
  margin-top: 20px;
  color: #cbd2df;
}

.units {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #718cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 25px;
  padding: 22px;
  background: #18233a;
  border-radius: 15px;
  text-align: center;
}

.result-title {
  color: #9da7bb;
  font-size: 14px;
}

.result-value {
  margin-top: 8px;
  color: #8da5ff;
  font-size: 26px;
  font-weight: bold;
  word-break: break-word;
}

footer {
  text-align: center;
  color: #687287;
  padding: 30px;
  font-size: 13px;
}

@media (max-width: 500px) {
  .units {
    grid-template-columns: 1fr;
  }
}

</style>
</head>

<body>

<header>
  <div class="logo">
    Tool<span>Nova</span>
  </div>
</header>

<div class="container">

<a href="index.html" class="back">
← Back to ToolNova
</a>

<div class="card">

<h1>📏 Unit Converter</h1>

<p class="description">
Convert length, weight, temperature and data units quickly and easily.
</p>

<label for="category">
Choose Category
</label>

<select id="category" onchange="loadUnits()">
  <option value="length">📏 Length</option>
  <option value="weight">⚖️ Weight</option>
  <option value="temperature">🌡️ Temperature</option>
  <option value="data">💾 Data</option>
</select>

<div class="units">

<div>

<label for="fromUnit">
From
</label>

<select id="fromUnit">
</select>

</div>

<div>

<label for="toUnit">
To
</label>

<select id="toUnit">
</select>

</div>

</div>

<label for="value">
Enter Value
</label>

<input
type="number"
id="value"
placeholder="Enter value"
oninput="convert()"
>

<button onclick="convert()">
Convert
</button>

<div class="result">

<div class="result-title">
Result
</div>

<div
class="result-value"
id="result">
0
</div>

</div>

</div>

</div>

<footer>
ToolNova — Free Tools. Simple. Fast.
</footer>

<script>

const units = {

length: {

meter: 1,
kilometer: 1000,
centimeter: 0.01,
millimeter: 0.001,
mile: 1609.344,
yard: 0.9144,
foot: 0.3048,
inch: 0.0254

},

weight: {

kilogram: 1,
gram: 0.001,
milligram: 0.000001,
pound: 0.45359237,
ounce: 0.0283495231

},

data: {

byte: 1,
kilobyte: 1024,
megabyte: 1024 * 1024,
gigabyte: 1024 * 1024 * 1024,
terabyte: 1024 * 1024 * 1024 * 1024

}

};


const names = {

meter: "Meter",
kilometer: "Kilometer",
centimeter: "Centimeter",
millimeter: "Millimeter",
mile: "Mile",
yard: "Yard",
foot: "Foot",
inch: "Inch",

kilogram: "Kilogram",
gram: "Gram",
milligram: "Milligram",
pound: "Pound",
ounce: "Ounce",

byte: "Byte",
kilobyte: "Kilobyte",
megabyte: "Megabyte",
gigabyte: "Gigabyte",
terabyte: "Terabyte"

};


function loadUnits() {

const category =
document.getElementById("category").value;

const from =
document.getElementById("fromUnit");

const to =
document.getElementById("toUnit");

from.innerHTML = "";
to.innerHTML = "";


if (category === "temperature") {

addOption(from, "celsius", "Celsius");
addOption(from, "fahrenheit", "Fahrenheit");
addOption(from, "kelvin", "Kelvin");

addOption(to, "celsius", "Celsius");
addOption(to, "fahrenheit", "Fahrenheit");
addOption(to, "kelvin", "Kelvin");

} else {

Object.keys(units[category]).forEach(function(unit) {

addOption(
from,
unit,
names[unit]
);

addOption(
to,
unit,
names[unit]
);

});

}

convert();

}


function addOption(select, value, text) {

const option =
document.createElement("option");

option.value = value;
option.textContent = text;

select.appendChild(option);

}


function convert() {

const category =
document.getElementById("category").value;

const value =
parseFloat(
document.getElementById("value").value
);

const from =
document.getElementById("fromUnit").value;

const to =
document.getElementById("toUnit").value;

const result =
document.getElementById("result");


if (isNaN(value)) {

result.textContent = "0";

return;

}


let answer;


if (category === "temperature") {

answer =
convertTemperature(
value,
from,
to
);

} else {

const baseValue =
value * units[category][from];

answer =
baseValue /
units[category][to];

}


if (!isFinite(answer)) {

result.textContent = "Invalid";

return;

}


result.textContent =
formatNumber(answer) +
" " +
names[to];

}


function convertTemperature(
value,
from,
to
) {

let celsius;


if (from === "celsius") {

celsius = value;

} else if (from === "fahrenheit") {

celsius =
(value - 32) * 5 / 9;

} else {

celsius =
value - 273.15;

}


if (to === "celsius") {

return celsius;

}

if (to === "fahrenheit") {

return celsius * 9 / 5 + 32;

}

return celsius + 273.15;

}


function formatNumber(number) {

if (Math.abs(number) >= 1000000000) {

return number.toExponential(6);

}

return Number(
number.toFixed(8)
).toLocaleString();

}


document
.getElementById("fromUnit")
.addEventListener(
"change",
convert
);

document
.getElementById("toUnit")
.addEventListener(
"change",
convert
);

loadUnits();

</script>

</body>
</html>
